[project]
name = "rideassist-backend"
version = "0.1.0"
description = "RideAssist — campus accessibility ride platform (backend services)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "B008", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"scripts/*" = ["S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
# SQLAlchemy's asyncio layer runs ORM code on greenlets; without this coverage misses it.
concurrency = ["greenlet", "thread"]
omit = ["tests/*", "scripts/*", "migrations/*"]
