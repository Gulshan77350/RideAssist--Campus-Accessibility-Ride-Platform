worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Keep the caller's X-Request-ID, or mint one, and forward it to every service.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    log_format json escape=json '{"ts":"$time_iso8601","request_id":"$req_id",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"upstream":"$upstream_addr","duration_s":$request_time}';
    access_log /dev/stdout json;

    # Edge rate limits (services enforce their own finer-grained limits too).
    limit_req_zone $binary_remote_addr zone=otp:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    # Resolve service names at request time via Docker's DNS (not once at startup), so a
    # recreated container with a new IP never receives traffic meant for another service.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        client_max_body_size 6m;

        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Security headers for the web app (map tiles come from OpenStreetMap).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' ws: wss:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

        location = /health { return 200 '{"status":"ok","service":"gateway"}'; default_type application/json; }

        # The notification service is internal-only and deliberately has no route here.
        location ~ ^/internal/ { return 404; }

        location ~ ^/api/v1/verification/otp/ {
            limit_req zone=otp burst=5 nodelay;
            set $upstream identity:8000;
            proxy_pass http://$upstream;
        }
        location ~ ^/api/v1/(auth|verification|colleges)(/|$) {
            limit_req zone=api burst=40 nodelay;
            set $upstream identity:8000;
            proxy_pass http://$upstream;
        }
        location ~ ^/api/v1/admin/(verifications|roster|staff|anomalies)(/|$) {
            limit_req zone=api burst=40 nodelay;
            set $upstream identity:8000;
            proxy_pass http://$upstream;
        }
        location ~ ^/api/v1/(rides|drivers)(/|$) {
            limit_req zone=api burst=40 nodelay;
            set $upstream rides:8000;
            proxy_pass http://$upstream;
        }
        location ~ ^/api/v1/admin/(fleet|rides|analytics)(/|$) {
            limit_req zone=api burst=40 nodelay;
            set $upstream rides:8000;
            proxy_pass http://$upstream;
        }
        location ~ ^/api/v1/track/ {
            set $upstream location:8000;
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
        }
        location ~ ^/api/v1/eta$ {
            set $upstream location:8000;
            proxy_pass http://$upstream;
        }

        location /api/ { return 404 '{"detail":"Not Found"}'; default_type application/json; }

        # Angular SPA: hashed bundles cache forever, index.html never does.
        root /usr/share/nginx/html;
        location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
            expires 1y;
            try_files $uri =404;
        }
        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
